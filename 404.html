<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 老袁编剧卡片系统</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #f4efe5; color: #211c16;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { text-align: center; padding: 32px; }
  h1 { font-family: "Songti SC", Georgia, serif; font-size: 26px; letter-spacing: .06em; }
  p { color: #7a6f60; font-size: 13px; margin: 10px 0 22px; }
  a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: #211c16; color: #f4efe5; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>这一页不存在</h1>
  <p>可能链接已经变了，回到卡片板继续写。</p>
  <a id="home" href="./">回到卡片板</a>
</main>
<script>
  (function () {
    var path = location.pathname.replace(/[^/]*$/, '');
    var link = document.getElementById('home');
    if (path && path !== '/') link.href = path;
  })();
</script>
</body>
</html>
